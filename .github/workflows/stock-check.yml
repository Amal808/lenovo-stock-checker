name: Stock Checker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run stock checker
        env:
          STOCK_SMTP_USER: ${{ secrets.STOCK_SMTP_USER }}
          STOCK_SMTP_PASSWORD: ${{ secrets.STOCK_SMTP_PASSWORD }}
          STOCK_TO_EMAIL: ${{ secrets.STOCK_TO_EMAIL }}
        run: python stock_checker.py

      - name: Persist stock state
        run: |
          git config user.name "stock-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stock_state.json
          git diff --cached --quiet || git commit -m "Update stock state"
          git push
